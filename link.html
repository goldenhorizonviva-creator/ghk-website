<meta charset="UTF-8">

<title>Golden Horizon Korea — 언어 선택 / Choose Language</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --horizon-navy:#00384c;
    --gold:#c9a24b;
    --gold-light:#e8cf8f;
    --sand:#f7f2e8;
    --ink:#2b2f36;
    --muted:#7c8794;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Noto Sans KR','Outfit',sans-serif;
    background:linear-gradient(180deg,#0e1f30 0%,#00384c 55%,#3a5a70 100%);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px 16px;
    color:var(--ink);
  }
  .card{
    width:100%;max-width:420px;
    background:var(--sand);
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.45);
    text-align:center;
  }
  .hero{
    position:relative;
    background:#00384c;
    padding:34px 28px 62px;
  }
  .hero .logo{
    width:190px;height:190px;
    margin:0 auto;display:block;
    border-radius:16px;
  }
  .horizon-line{
    position:absolute;left:0;right:0;bottom:0;height:38px;
    background:var(--sand);
    border-radius:100% 100% 0 0 / 70px 70px 0 0;
  }
  .body{
    padding:36px 30px 40px;
  }
  .title{
    font-family:'Cormorant Garamond',serif;
    font-size:26px;font-weight:600;color:var(--horizon-navy);
    margin-bottom:6px;
  }
  .subtitle{
    font-size:14px;color:var(--muted);margin-bottom:30px;line-height:1.7;
  }
  .subtitle .ko-line{display:block;color:var(--horizon-navy);font-weight:500}
  .subtitle .en-line{display:block;font-style:italic}
  .lang-btn{
    display:block;
    width:100%;
    padding:14px 0;
    border-radius:10px;
    text-decoration:none;
    text-align:center;
    font-size:15px;font-weight:600;letter-spacing:.02em;
    transition:transform .12s, box-shadow .12s;
  }
  .lang-btn:active{transform:scale(.97)}
  .lang-btn.ko{
    background:var(--horizon-navy);color:var(--gold-light);
    box-shadow:0 6px 14px rgba(0,56,76,.3);
    margin-bottom:14px;
  }
  .lang-btn.en{
    background:linear-gradient(135deg,var(--gold),#b58c33);
    color:#fff;
    box-shadow:0 6px 14px rgba(181,140,51,.35);
  }
  .lang-row{margin-bottom:26px}
  .foot{
    margin-top:26px;
    font-size:11.5px;color:var(--muted);
    letter-spacing:.03em;line-height:1.6;
  }
</style>
</head>
